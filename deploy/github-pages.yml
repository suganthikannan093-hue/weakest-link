# To enable: copy this file to .github/workflows/pages.yml (needs a push with the `workflow` scope).
# Deploys the static web UI (dist/) to GitHub Pages.
# Manual only: run it from the Actions tab once the repo is public and Pages is
# enabled with "Source: GitHub Actions". Nothing runs automatically while private.
name: Deploy web UI to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
